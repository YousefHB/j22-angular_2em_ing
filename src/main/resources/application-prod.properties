# ===== Production Configuration =====
spring.application.name=shopflow
server.port=${PORT:8084}
server.servlet.context-path=/api

# ===== JPA/Hibernate Settings =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Auto-detect dialect based on database
spring.jpa.database-platform=

# ===== MySQL Database Configuration (Production) =====
# For MySQL: jdbc:mysql://host:3306/database
# For PostgreSQL: jdbc:postgresql://host:5432/database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===== Connection Pool =====
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===== Logging (Production - Less verbose) =====
logging.level.root=INFO
logging.level.com.shopflow=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ===== JWT Settings =====
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# ===== CORS Configuration =====
# Separate multiple origins with comma: http://localhost:4200,https://yourapp.web.app
app.cors.allowed-origins=${FRONTEND_URL:https://shopflow-25917.web.app},http://localhost:4200

# ===== OpenAPI/Swagger =====
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
