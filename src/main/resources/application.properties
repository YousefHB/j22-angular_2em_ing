# ===== Application Settings =====
spring.application.name=shopflow
server.port=8084
server.servlet.context-path=/api

# ===== JPA/Hibernate Settings =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===== MySQL Database Configuration =====
spring.datasource.url=jdbc:mysql://localhost:3306/shopflow_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== Connection Pool =====
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# ===== Logging =====
logging.level.root=INFO
logging.level.com.shopflow=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ===== JWT Settings =====
app.jwt.secret=your-super-secret-jwt-key-that-must-be-min-32-characters-long-for-security
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# ===== Security - Default User =====
spring.security.user.name=admin
spring.security.user.password=admin123
# ===== Security =====
spring.security.filter.order=5
# ===== OpenAPI/Swagger =====
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html