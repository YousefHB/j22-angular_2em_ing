<!-- Liste Utilisateurs (ADMIN) -->
<div class="page-container">
  <div class="page-header">
    <h1>Utilisateurs</h1>
  </div>

  <mat-card class="mat-elevation-z2">
    <div class="loading-overlay" *ngIf="loading"><mat-spinner diameter="40"></mat-spinner></div>

    <mat-table [dataSource]="users" *ngIf="!loading" id="table-utilisateurs">

      <ng-container matColumnDef="name">
        <mat-header-cell *matHeaderCellDef>Nom</mat-header-cell>
        <mat-cell *matCellDef="let u">{{ u.firstName }} {{ u.lastName }}</mat-cell>
      </ng-container>

      <ng-container matColumnDef="email">
        <mat-header-cell *matHeaderCellDef>Email</mat-header-cell>
        <mat-cell *matCellDef="let u">{{ u.email }}</mat-cell>
      </ng-container>

      <ng-container matColumnDef="role">
        <mat-header-cell *matHeaderCellDef>Rôle</mat-header-cell>
        <mat-cell *matCellDef="let u">
          <span class="badge" [ngClass]="'badge-' + u.role.toLowerCase()">{{ u.role }}</span>
        </mat-cell>
      </ng-container>

      <ng-container matColumnDef="active">
        <mat-header-cell *matHeaderCellDef>Statut</mat-header-cell>
        <mat-cell *matCellDef="let u">
          <span class="badge" [ngClass]="u.active ? 'badge-active' : 'badge-inactive'">
            {{ u.active ? 'Actif' : 'Inactif' }}
          </span>
        </mat-cell>
      </ng-container>

      <ng-container matColumnDef="date">
        <mat-header-cell *matHeaderCellDef>Inscrit le</mat-header-cell>
        <mat-cell *matCellDef="let u">{{ u.createdAt | date:'dd/MM/yyyy' }}</mat-cell>
      </ng-container>

      <ng-container matColumnDef="actions">
        <mat-header-cell *matHeaderCellDef>Actions</mat-header-cell>
        <mat-cell *matCellDef="let u">
          <button mat-icon-button (click)="onToggleActive(u)"
                  [matTooltip]="u.active ? 'Désactiver' : 'Activer'"
                  id="btn-toggle-user-{{u.id}}">
            <mat-icon [style.color]="u.active ? '#f59e0b' : '#10b981'">
              {{ u.active ? 'person_off' : 'person' }}
            </mat-icon>
          </button>
          <button mat-icon-button class="btn-delete" (click)="onDelete(u)"
                  matTooltip="Supprimer" id="btn-supprimer-user-{{u.id}}">
            <mat-icon>delete</mat-icon>
          </button>
        </mat-cell>
      </ng-container>

      <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
      <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>

    <div class="empty-state" *ngIf="!loading && users.length === 0">
      <mat-icon>people</mat-icon>
      <p>Aucun utilisateur</p>
    </div>

    <mat-paginator [pageSize]="10" [pageSizeOptions]="[5,10,20]"
                   [length]="totalElements" (page)="onPageChange($event)"
                   showFirstLastButtons>
    </mat-paginator>
  </mat-card>
</div>
