<div class="page-container">
  <div class="page-header">
    <h1>Mes Adresses</h1>
    <button mat-raised-button color="primary" (click)="openAddressDialog()">
      <mat-icon>add</mat-icon> Ajouter une adresse
    </button>
  </div>

  <div class="loading-overlay" *ngIf="loading"><mat-spinner diameter="40"></mat-spinner></div>

  <div class="addresses-list" *ngIf="!loading">
    <mat-card class="address-item" *ngFor="let addr of addresses">
      <mat-card-content>
        <div class="addr-header">
          <span class="badge badge-active" *ngIf="addr.isPrimary">Principale</span>
          <div class="actions">
            <button mat-icon-button color="primary" (click)="openAddressDialog(addr)" matTooltip="Modifier">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteAddress(addr)" matTooltip="Supprimer">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </div>
        <div class="addr-body">
          <p><strong>Rue:</strong> {{ addr.street }}</p>
          <p><strong>Ville:</strong> {{ addr.postalCode }} {{ addr.city }}</p>
          <p><strong>Pays:</strong> {{ addr.country }}</p>
        </div>
      </mat-card-content>
    </mat-card>

    <div class="empty-state" *ngIf="addresses.length === 0">
      <mat-icon>location_off</mat-icon>
      <p>Vous n'avez pas encore d'adresse enregistrée.</p>
    </div>
  </div>
</div>
