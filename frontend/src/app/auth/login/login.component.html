<!-- ═══════════════════════════════════════════════════════════════
     ArtShop — Connexion
     ═══════════════════════════════════════════════════════════════ -->
<div class="art-form-page" style="margin-top: 40px; max-width: 600px;">
  <div class="art-form-header fade-in-up" style="justify-content: center; text-align: center;">
    <div class="header-titles" style="align-items: center;">
      <div style="width: 64px; height: 64px; border-radius: 16px; background: linear-gradient(135deg, var(--art-or), #B8922A); color: var(--art-nuit); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; box-shadow: 0 8px 24px rgba(212, 175, 119, 0.4);">
        <mat-icon style="font-size: 32px; width: 32px; height: 32px;">palette</mat-icon>
      </div>
      <h1 style="font-size: 2.8rem; margin-bottom: 8px;">Bienvenue</h1>
      <p class="subtitle">Connectez-vous pour accéder à votre galerie personnelle.</p>
    </div>
  </div>

  <div class="art-form-card fade-in-up" style="animation-delay: 0.1s;">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="art-form-grid single-col">
        <mat-form-field appearance="outline" class="art-field">
          <mat-label>Adresse e-mail</mat-label>
          <input matInput type="email" formControlName="email" placeholder="exemple@email.com" autocomplete="email">
          <mat-icon matPrefix style="color: var(--art-or); margin-right: 8px;">email</mat-icon>
          <mat-error *ngIf="loginForm.get('email')?.hasError('required')">L'e-mail est requis.</mat-error>
          <mat-error *ngIf="loginForm.get('email')?.hasError('email')">E-mail invalide.</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="art-field">
          <mat-label>Mot de passe</mat-label>
          <input matInput [type]="showPassword ? 'text' : 'password'" formControlName="password" autocomplete="current-password">
          <mat-icon matPrefix style="color: var(--art-sienne); margin-right: 8px;">lock</mat-icon>
          <button mat-icon-button matSuffix type="button" (click)="showPassword = !showPassword" style="color: var(--art-text-light)">
            <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">Le mot de passe est requis.</mat-error>
        </mat-form-field>
      </div>

      <div class="error-message-art" *ngIf="errorMessage">
        <mat-icon>error</mat-icon> {{ errorMessage }}
      </div>

      <div class="art-form-actions" style="flex-direction: column; gap: 24px; padding-top: 24px;">
        <button mat-raised-button type="submit" class="btn-art-primary" [disabled]="loginForm.invalid || loading" style="width: 100%; height: 52px; font-size: 16px;">
          <mat-spinner *ngIf="loading" diameter="20" style="margin-right: 8px; display: inline-block; vertical-align: middle;"></mat-spinner>
          <mat-icon *ngIf="!loading">login</mat-icon> Se Connecter
        </button>

        <div style="text-align: center; color: var(--art-text-light); font-size: 14px; font-family: 'Inter', sans-serif;">
          <p style="margin: 0 0 8px 0;">Pas encore de compte ? <a routerLink="/inscription" style="color: var(--art-sienne); font-weight: 600;">S'inscrire</a></p>
          <p style="margin: 0;"><a routerLink="/" style="color: var(--art-text-light);">← Retour à la galerie publique</a></p>
        </div>
      </div>

    </form>
  </div>
</div>
